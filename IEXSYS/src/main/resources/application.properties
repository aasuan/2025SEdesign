spring.application.name=IEXSYS

## Database
spring.datasource.url=jdbc:mysql://localhost:5432/online_exam_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Redis (Spring Session 存储)
# 如果未安装 Redis，可以注释掉以下配置，使用内存 Session
spring.data.redis.host=localhost
spring.data.redis.port=2977
spring.data.redis.database=0
spring.session.store-type=redis
spring.session.redis.namespace=iexsys:session
# 使用内存 Session（默认，无需 Redis）
# 需要使用时取消注释
# 注意：应用重启后 Session 会丢失，但适合开发测试
spring.session.timeout=30m

## MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.exp.iexsys.domain
mybatis.configuration.map-underscore-to-camel-case=true

## Misc
server.port=8080
spring.jackson.time-zone=Asia/Shanghai

# CompreFace
compreface.base-url=http://localhost:8000
# TODO: replace with your own CompreFace Verification service API key if rotated
compreface.api-key=75c3ee03-dcce-4908-a0eb-db0c2d74c434
# Similarity threshold for passing verification (0-1)
compreface.verify-threshold=0.88
# Minimum detection probability (lower makes it easier to detect faces)
compreface.det-prob-threshold=0.4
